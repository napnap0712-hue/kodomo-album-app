<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>顔グループ化・独立試作</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;color:#263344;background:#f6f8fc}body{margin:0;padding:20px;max-width:980px;margin:auto}h1{font-size:1.45rem}p{line-height:1.6}.panel{background:white;padding:16px;border-radius:16px;margin:12px 0;box-shadow:0 2px 10px #0001}button,.button{border:0;border-radius:12px;padding:12px 16px;background:#176ad6;color:white;font-weight:700;cursor:pointer}button:disabled{opacity:.45}button.secondary{background:#e9eef5;color:#263344}input[type=file]{display:block;margin:12px 0;max-width:100%}input[type=range]{width:200px;vertical-align:middle}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}.group{border:1px solid #dbe2ed;border-radius:12px;padding:10px;background:#fff}.faces{display:flex;flex-wrap:wrap;gap:6px}.face{width:60px;height:60px;object-fit:cover;border-radius:10px;border:3px solid transparent;cursor:pointer}.face.selected{border-color:#176ad6}.muted{color:#66758b;font-size:.88rem}.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}#status{white-space:pre-wrap}label{display:inline-block;margin:8px 0}</style></head>
<body><h1>🧪 AI顔グループ化・独立試作</h1><p class="muted">既存アルバム・園児フォルダには反映しません。写真と特徴データは保存・アップロードしません。初回はAIモデルのダウンロードが必要です。</p>
<section class="panel"><strong>① 写真を選択</strong><input id="photos" type="file" accept="image/*" multiple><button type="button" id="addPhotos" class="secondary">＋ 写真を追加選択</button><p id="photoCount" class="muted">0枚選択済み（追加選択できます）</p><div class="actions"><label>グループの厳しさ <input id="threshold" type="range" min="0.45" max="0.90" value="0.70" step="0.01"> <output id="thresholdValue">0.70</output></label><button id="start">解析して仮グループ化</button><button id="cancel" class="secondary" disabled>中断</button></div><p id="status" role="status">まだ解析していません。</p></section>
<section class="panel"><strong>② 顔を確認・修正</strong><p class="muted">顔をクリックして選択 → 移動先を選択。判定が難しい顔は「未分類」に残します。グループは仮番号で、園児名には結び付けません。</p><div class="actions"><span id="selection">選択中：0件</span><select id="destination" aria-label="移動先グループ"></select><button id="move" disabled>選択した顔を移動</button><button id="clear" class="secondary">選択解除</button></div><div id="groups" class="grid"></div></section>
<script type="module" src="./face-recognition/face-cluster-prototype.mjs"></script></body></html>
