<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>おもいでブック｜複数選択・固定 試作</title>
<style>
*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:#f7f8fb;color:#354054;margin:0}main{max-width:740px;margin:auto;padding:18px 14px 36px}h1{font-size:20px;margin:8px 0}.sub{font-size:12px;color:#728096;line-height:1.7}.bar,.tools{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}button{border:1px solid #dce3eb;border-radius:11px;padding:10px 12px;background:white;color:#374458;font-weight:700;min-height:42px}button.primary{background:#556bc1;color:#fff;border-color:#556bc1}button.active{background:#e6eafe;border-color:#556bc1}button:disabled{opacity:.45}.stage{padding:10px;background:#e5e9ef;border-radius:14px}.spread{position:relative;width:100%;aspect-ratio:1.414;background:#fff;overflow:hidden;touch-action:none;border-radius:5px}.spread:after{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:1px dashed #cbd1da;pointer-events:none}.item{position:absolute;display:flex;align-items:center;justify-content:center;touch-action:none;user-select:none;transform-origin:center;white-space:pre-wrap;text-align:center;overflow:hidden;border:2px solid transparent;cursor:grab}.item.selected{border-color:#536dd0;outline:1px solid #fff;z-index:10}.item.photo{background:linear-gradient(140deg,#f6c7d9,#e3e7fb);font-size:clamp(13px,4vw,28px)}.item.text{font-weight:800;color:#8c6385;font-size:clamp(10px,3vw,22px)}.item.stamp{font-size:clamp(18px,5vw,36px)}.lockBadge{position:absolute;top:2px;right:2px;background:#fff;border-radius:6px;padding:2px;font-size:11px;display:none}.showLocks .item.locked .lockBadge,.item.selected.locked .lockBadge{display:block}.status{min-height:26px;font-size:13px;color:#56658a;margin:12px 0}.hint{font-size:12px;line-height:1.7;color:#68758a}.group{border:1px solid #e0e6ef;border-radius:12px;padding:10px;background:#fff;margin:12px 0}.group strong{font-size:13px}input[type=range]{width:130px;vertical-align:middle}dialog{border:0;border-radius:17px;max-width:min(90vw,420px);box-shadow:0 12px 60px #2225;padding:20px}dialog::backdrop{background:#1c263b77}dialog p{line-height:1.6;font-size:14px}dialog menu{padding:0;display:flex;flex-wrap:wrap;gap:7px;justify-content:flex-end}label{font-size:12px}
</style></head><body><main><div class="sub">開発用の独立した試作画面｜既存データには接続しません</div><h1>📖 複数選択・固定の操作テスト</h1><p class="sub">「複数選択」を押して要素を順にタップ。選択した要素はまとめて動かせます。固定中の要素が混ざっている場合は操作方法を選べます。</p>
<div class="bar"><button id="multi">☑ 複数選択：OFF</button><button id="clear">選択解除</button><button id="show">🔒 固定を表示：OFF</button></div>
<div class="stage"><div id="spread" class="spread" aria-label="編集キャンバス"></div></div>
<div class="status" id="status" role="status">要素をタップして選択してください</div>
<div class="group"><strong>選択した要素を操作</strong><div class="tools"><button id="lock">🔒 固定</button><button id="unlock">🔓 解除</button><button id="del">🗑 削除</button></div><div class="tools"><label>拡大縮小 <input id="scale" type="range" min="70" max="130" value="100"></label><label>回転 <input id="rotate" type="range" min="-30" max="30" value="0"></label></div><p class="hint">拡大縮小・回転は現在の配置に対する相対操作です。指でドラッグするとまとめて移動できます。</p></div>
<div class="bar"><button id="reset">↩ 試作を初期状態に戻す</button></div><p class="hint">この試作は複数選択と固定の操作感を確認するための独立画面です。写真の取り込みや既存プロジェクト保存などは接続していません。</p>
<dialog id="dialog"><strong id="dialogTitle"></strong><p id="dialogText"></p><menu id="dialogActions"></menu></dialog></main>
<script>
(()=>{'use strict';
const initial=[{id:1,type:'photo',text:'🌷',x:7,y:17,w:20,h:38,a:0,s:1,locked:false},{id:2,type:'photo',text:'🌻',x:31,y:18,w:17,h:36,a:0,s:1,locked:true},{id:3,type:'photo',text:'🌈',x:54,y:20,w:20,h:35,a:0,s:1,locked:false},{id:4,type:'text',text:'たのしい おもいで',x:11,y:64,w:36,h:14,a:0,s:1,locked:false},{id:5,type:'stamp',text:'✨',x:75,y:57,w:13,h:22,a:0,s:1,locked:false}];
let items=structuredClone(initial),selected=new Set(),multi=false,showLocks=false,gesture=null;
const $=id=>document.getElementById(id),spread=$('spread');
const chosen=()=>items.filter(i=>selected.has(i.id));
function render(){spread.innerHTML='';spread.classList.toggle('showLocks',showLocks);items.forEach(i=>{let e=document.createElement('div');e.className='item '+i.type+(selected.has(i.id)?' selected':'')+(i.locked?' locked':'');e.dataset.id=i.id;e.style.cssText='left:'+i.x+'%;top:'+i.y+'%;width:'+i.w+'%;height:'+i.h+'%;transform:rotate('+i.a+'deg) scale('+i.s+')';e.textContent=i.text;const badge=document.createElement('span');badge.className='lockBadge';badge.textContent='🔒';e.append(badge);spread.append(e)});$('status').textContent=selected.size?selected.size+'個選択中（固定 '+chosen().filter(i=>i.locked).length+'個）':'要素をタップして選択してください';$('multi').textContent='☑ 複数選択：'+(multi?'ON':'OFF');$('multi').classList.toggle('active',multi);$('show').textContent='🔒 固定を表示：'+(showLocks?'ON':'OFF');$('show').classList.toggle('active',showLocks);['lock','unlock','del','scale','rotate'].forEach(id=>$(id).disabled=!selected.size)}
function dialog(title,message,actions){$('dialogTitle').textContent=title;$('dialogText').textContent=message;$('dialogActions').innerHTML='';actions.forEach(([label,fn])=>{const b=document.createElement('button');b.textContent=label;b.onclick=()=>{$('dialog').close();fn?.()};$('dialogActions').append(b)});$('dialog').showModal()}
function decide(action){const group=chosen();if(!group.length)return;const locked=group.filter(i=>i.locked);if(!locked.length){action(group);return}dialog('🔒 固定中の要素があります',locked.length+'個が固定されています。どちらの操作にしますか？',[['キャンセル'],['固定以外を操作',()=>action(group.filter(i=>!i.locked))],['固定解除して全体を操作',()=>{group.forEach(i=>i.locked=false);action(group)}]])}
$('multi').onclick=()=>{multi=!multi;render()};$('clear').onclick=()=>{selected.clear();render()};$('show').onclick=()=>{showLocks=!showLocks;render()};
$('lock').onclick=()=>{chosen().forEach(i=>i.locked=true);render()};$('unlock').onclick=()=>{chosen().forEach(i=>i.locked=false);render()};
$('del').onclick=()=>{const group=chosen(),n=group.filter(i=>i.locked).length;dialog('選択要素を削除しますか？',group.length+'個を削除します。'+(n?'うち'+n+'個は固定中です。':''),[['キャンセル'],['削除する',()=>{items=items.filter(i=>!selected.has(i.id));selected.clear();render()}]])};
function transform(kind,v){decide(group=>{if(kind==='scale'){const f=v/100;const cx=group.reduce((a,i)=>a+i.x+i.w/2,0)/group.length,cy=group.reduce((a,i)=>a+i.y+i.h/2,0)/group.length;group.forEach(i=>{i.x=cx+(i.x+i.w/2-cx)*f-i.w/2;i.y=cy+(i.y+i.h/2-cy)*f-i.h/2;i.s*=f})}else{const rad=v*Math.PI/180,cx=group.reduce((a,i)=>a+i.x+i.w/2,0)/group.length,cy=group.reduce((a,i)=>a+i.y+i.h/2,0)/group.length;group.forEach(i=>{const dx=i.x+i.w/2-cx,dy=i.y+i.h/2-cy;i.x=cx+dx*Math.cos(rad)-dy*Math.sin(rad)-i.w/2;i.y=cy+dx*Math.sin(rad)+dy*Math.cos(rad)-i.h/2;i.a+=v})}render()})}
['scale','rotate'].forEach(id=>{const input=$(id);input.addEventListener('change',()=>{const v=Number(input.value)-(id==='scale'?100:0);input.value=id==='scale'?100:0;if(v)transform(id,id==='scale'?100+v:v)})});
spread.addEventListener('pointerdown',e=>{const el=e.target.closest('.item');if(!el)return;const id=Number(el.dataset.id);if(multi){if(selected.has(id))selected.delete(id);else selected.add(id);render();return}if(!selected.has(id)){selected=new Set([id]);render()}gesture={id,x:e.clientX,y:e.clientY,moved:false,orig:chosen().map(i=>({id:i.id,x:i.x,y:i.y})),allowed:false};spread.setPointerCapture(e.pointerId)});
spread.addEventListener('pointermove',e=>{if(!gesture)return;const dx=(e.clientX-gesture.x)/spread.clientWidth*100,dy=(e.clientY-gesture.y)/spread.clientHeight*100;if(Math.abs(e.clientX-gesture.x)+Math.abs(e.clientY-gesture.y)<6)return;if(!gesture.moved){gesture.moved=true;const locked=chosen().filter(i=>i.locked);if(locked.length){const g=gesture;gesture=null;decide(group=>{gesture={...g,allowed:true,orig:group.map(i=>({id:i.id,x:i.x,y:i.y}))};$('status').textContent='固定の扱いを選びました。もう一度ドラッグしてください';gesture=null});return}gesture.allowed=true}if(!gesture.allowed)return;gesture.orig.forEach(o=>{const i=items.find(i=>i.id===o.id);if(i){i.x=o.x+dx;i.y=o.y+dy}});render()});
spread.addEventListener('pointerup',()=>{gesture=null});spread.addEventListener('pointercancel',()=>{gesture=null});
$('reset').onclick=()=>{dialog('初期状態に戻しますか？','試作画面の要素配置と固定状態を初期状態に戻します。',[['キャンセル'],['戻す',()=>{items=structuredClone(initial);selected.clear();render()}]])};
render();
})();
</script></body></html>
