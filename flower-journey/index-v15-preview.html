<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FLOWER JOURNEY｜Ver.15 接続テスト</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#dceee8}iframe{width:100%;height:100%;border:0;position:absolute;inset:0;display:block}#master{z-index:1}#game{display:none;z-index:4;background:#d4e7a0;opacity:1;transform:scale(1);will-change:opacity,transform,filter}#game.return-zoom{opacity:0;transform:scale(1.115);filter:blur(8px);pointer-events:none;transition:opacity 1s cubic-bezier(.15,.7,.2,1),transform 1s cubic-bezier(.15,.7,.2,1),filter 1s ease}#curtain{position:fixed;inset:0;z-index:5;pointer-events:none;background:#dceee8;opacity:0;transition:opacity .32s ease}#curtain.on{opacity:1}
</style></head><body><iframe id="master" title="完成済み冒険マップと説明アニメーション" src="master-LOCKED.html"></iframe><iframe id="game" title="ゲーム"></iframe><div id="curtain"></div><script>
(()=>{'use strict';
const master=document.getElementById('master'),game=document.getElementById('game'),curtain=document.getElementById('curtain');
let activeStage='',switching=false,returnInProgress=false;
function showGame(src,title,isolated=false){if(switching||returnInProgress)return;switching=true;curtain.classList.add('on');game.classList.remove('return-zoom');game.style.removeProperty('opacity');game.style.removeProperty('transform');game.style.removeProperty('filter');game.style.removeProperty('transition');game.onload=()=>{game.style.display='block';requestAnimationFrame(()=>requestAnimationFrame(()=>{curtain.classList.remove('on');switching=false;}));};game.title=title;if(isolated)game.setAttribute('sandbox','allow-scripts');else game.removeAttribute('sandbox');game.src=src;}
const startStage=()=>activeStage==='写真追加'?()=>showGame('games/photo-add.html','写真追加'):activeStage==='おもいでキャッチ！'?()=>showGame('games/memory-catch-v15-preview.html','おもいでキャッチ！',true):null;
master.addEventListener('load',()=>{try{const w=master.contentWindow,d=w.document;d.addEventListener('click',e=>{const button=e.target.closest?.('.tap');if(button)activeStage=String(button.dataset.title||'');},true);const frame=d.getElementById('stageFrame');if(!frame)throw Error('stageFrame missing');frame.addEventListener('load',()=>{try{frame.contentDocument.addEventListener('click',e=>{const start=startStage();if(!start)return;const button=e.target.closest?.('button');if(button&&(button.id==='start'||button.id==='cta'&&button.textContent.includes('はじめよう'))){e.preventDefault();e.stopImmediatePropagation();start();}},true);}catch(err){console.error('guide hook',err)}});w.addEventListener('message',e=>{const start=startStage();if(start&&e.source===frame.contentWindow&&e.data?.type==='flower-stage-start'){e.stopImmediatePropagation();start();}},true);}catch(err){console.error('map setup',err)}});
window.addEventListener('message',e=>{if(e.source!==game.contentWindow||returnInProgress)return;const photoSaved=activeStage==='写真追加'&&e.data?.type==='flower-stage-complete'&&e.data?.saved===true;const catchDemoFinished=activeStage==='おもいでキャッチ！'&&e.data?.type==='flower-stage-complete'&&e.data?.stage==='memory-catch'&&e.data?.demo===true&&e.data?.complete===true&&e.data?.saved===false;const catchBack=activeStage==='おもいでキャッチ！'&&e.data?.type==='flower-stage-back';if(photoSaved||catchDemoFinished||catchBack)returnToMap();});
function returnToMap(){returnInProgress=true;try{const doc=master.contentDocument,panel=doc?.getElementById('stagePanel'),frame=doc?.getElementById('stageFrame'),shade=doc?.getElementById('shade');if(!panel||!frame)throw Error('stage panel missing');master.contentWindow.onComparisonBack?.();if(shade)shade.hidden=true;panel.classList.remove('stage-visible','stage-leaving');panel.hidden=true;let finished=false,fallback;const end=e=>{if(e.target===game&&e.propertyName==='opacity')finish()};const finish=()=>{if(finished)return;finished=true;clearTimeout(fallback);game.removeEventListener('transitionend',end);game.style.display='none';game.classList.remove('return-zoom');game.style.removeProperty('opacity');game.style.removeProperty('transform');game.style.removeProperty('filter');activeStage='';switching=false;returnInProgress=false;};requestAnimationFrame(()=>requestAnimationFrame(()=>{game.addEventListener('transitionend',end);game.classList.add('return-zoom');fallback=setTimeout(finish,1250);}));}catch(err){console.error('map return',err);returnInProgress=false;}}
})();
</script></body></html>
