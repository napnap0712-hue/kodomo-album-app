<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>おもいでブック｜第9段階 架空暗号化プロトタイプ</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#d9f4e7;font-family:system-ui,"Yu Gothic",sans-serif;color:#486c5e}
[hidden]{display:none!important}iframe{display:block;width:100%;height:100%;border:0;background:#d9f4e7}
#entry{position:absolute;inset:0}#mapView{position:absolute;inset:0;display:flex;flex-direction:column;opacity:0;pointer-events:none;background:#dfeee5}
#mapView.visible{opacity:1;pointer-events:auto;transition:opacity .9s ease}
#mapView.reveal #map{animation:softZoom 1s cubic-bezier(.2,.7,.2,1) both;transform-origin:50% 55%}
@keyframes softZoom{from{transform:scale(1.08);filter:blur(6px)}to{transform:scale(1);filter:blur(0)}}
.mapBar{flex:none;min-height:54px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px max(10px,env(safe-area-inset-right));background:#fff8e9;font-size:13px;color:#645346}.mapBar small{display:block;font-size:10px;line-height:1.5}.mapBar button,#retry{border:1px solid #dca8ab;border-radius:20px;padding:10px 12px;background:#f5c6cf;color:#624d43;cursor:pointer;font:inherit}
#mapArea{flex:1;min-height:0;position:relative;overflow:hidden}#map,#demoGame,#friendRegistration{position:absolute;inset:0;width:100%;height:100%}#demoGame,#friendRegistration{z-index:2;opacity:1;transform:scale(1);transform-origin:center;will-change:opacity,transform,filter}#demoGame.return-zoom,#friendRegistration.return-zoom{opacity:0;transform:scale(1.115);filter:blur(8px);pointer-events:none;transition:opacity 1s cubic-bezier(.15,.7,.2,1),transform 1s cubic-bezier(.15,.7,.2,1),filter 1s ease}#friendRegistration.enter-zoom{animation:friendZoom 1s cubic-bezier(.2,.7,.2,1) both}@keyframes friendZoom{from{opacity:0;transform:scale(1.08);filter:blur(6px)}to{opacity:1;transform:scale(1);filter:blur(0)}}@media(prefers-reduced-motion:reduce){#friendRegistration.enter-zoom{animation:none}}#notice{position:fixed;bottom:max(10px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:max-content;max-width:92vw;padding:10px 16px;border-radius:18px;background:#fff9ee;box-shadow:0 3px 20px #264c4340;z-index:30;text-align:center;font-size:13px}#retry{margin-left:8px}
.petals{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:20}.petal{position:absolute;width:var(--size,14px);height:calc(var(--size,14px)*1.42);border-radius:85% 12% 78% 14%;background:var(--color);animation:petalWhirl var(--duration,2.8s) ease-out both;will-change:transform,opacity}
@keyframes petalWhirl{0%{opacity:0;transform:translate(-50%,-50%) rotate(0deg) scale(.35) scaleX(1)}9%{opacity:1}22%{transform:translate(calc(-50% + var(--x1)),calc(-50% + var(--y1))) rotate(125deg) scale(.95) scaleX(.35)}43%{opacity:1;transform:translate(calc(-50% + var(--x2)),calc(-50% + var(--y2))) rotate(315deg) scale(1) scaleX(-.8)}66%{transform:translate(calc(-50% + var(--x3)),calc(-50% + var(--y3))) rotate(520deg) scale(.95) scaleX(.22)}85%{opacity:.86;transform:translate(calc(-50% + var(--x4)),calc(-50% + var(--y4))) rotate(710deg) scale(.88) scaleX(.8)}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(900deg) scale(.65) scaleX(-.4)}}
@media(prefers-reduced-motion:reduce){.petal{display:none}#mapView.visible{transition:none}#mapView.reveal #map{animation:none}}
</style>
<script src="class-data-boundary.js" defer></script>
<script src="friend-roster-view-adapter.js" defer></script>
<script src="fictional-roster-fixture.js" defer></script>
<script src="fictional-roster-readonly-adapter.js" defer></script>
<script src="fictional-roster-crypto.js" defer></script>
<script src="stage9-vault.js" defer></script>
<script src="stage10-roster-crypto.js" defer></script>
<script src="stage10-roster-store.js" defer></script>
<script src="stage11-memory-adapter.js" defer></script>
<script src="stage10-registration.js" defer></script>
<script src="demo-connection.js" defer></script>
<script src="stage9-entry.js" defer></script>
</head>
<body>
<!-- Opaque origins intentionally deny access to all existing browser storage and app APIs. -->
<iframe id="entry" title="採用済みクラス選択と第9段階テストパスフレーズ" sandbox="allow-scripts allow-forms" referrerpolicy="no-referrer"></iframe>
<section id="mapView" aria-label="第9段階 架空データ用マップ" hidden>
 <header class="mapBar"><div><b id="mapClass"></b><small>第9段階・架空データ専用・本番利用不可<br>架空画像のみ・保存は検証用メモリ内（本保存なし）</small></div><button id="logout" type="button">ログアウト</button></header>
 <div id="mapArea"><iframe id="map" title="既存の冒険マップと8種類の説明アニメーション" sandbox="allow-scripts" referrerpolicy="no-referrer"></iframe><iframe id="demoGame" title="検証用ゲーム" sandbox="allow-scripts" referrerpolicy="no-referrer" hidden></iframe><iframe id="friendRegistration" title="おともだち登録 Ver.6（デモ）" sandbox="allow-scripts allow-forms" referrerpolicy="no-referrer" hidden></iframe></div>
</section>
<div id="petals" class="petals" aria-hidden="true"></div>
<div id="notice" role="status"><span id="status">第9段階の入口を読み込んでいます…</span><button id="retry" type="button" hidden>もう一度読み込む</button></div>
</body>
</html>
