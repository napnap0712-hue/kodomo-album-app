<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>おもいでキャッチ！｜接続確認</title>
<link rel="stylesheet" href="../../photo-merge.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:#e8f8f3;color:#365d70;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Maru Gothic ProN","Yu Gothic",sans-serif}
button{font:inherit;cursor:pointer}
button:disabled{cursor:default;opacity:.55}
.stage-shell{max-width:760px;margin:auto;padding:16px 12px calc(24px + env(safe-area-inset-bottom))}
.map-back{padding:10px 16px;border:2px solid white;border-radius:24px;background:#fff7dc;color:#52695d;font-weight:800}
.prototype-note{font-size:13px;line-height:1.7;padding:12px;border-radius:16px;background:#fffbea}
.catchFinishCard .map-back{display:block;width:100%;margin-top:16px}
</style>
</head>
<body>
<main class="stage-shell">
  <button class="map-back" id="mapBack" type="button">‹ マップへ（保存せず戻る）</button>
  <p class="prototype-note" id="dataNotice" role="status">既存の振り分け途中保存を読み取り専用で確認しています。本保存は未接続です。</p>
  <section class="screen" data-screen="photoAssign" data-flow-step="review" aria-label="おもいでキャッチ！接続確認">
    <div id="gameHost"></div>
  </section>
  <p id="stageStatus" role="status" aria-live="polite"></p>
</main>
<!-- Reuse the existing game unchanged; only its in-memory host API is adapted. -->
<script src="../../photo-merge-ui.js"></script>
<script>
(()=>{
 'use strict';
 const host=document.getElementById('gameHost');
 const status=document.getElementById('stageStatus');
 function sampleData(){
 const children=[
  {id:'demo-hana',name:'テスト はな'},
  {id:'demo-sora',name:'テスト そら'},
  {id:'demo-hikari',name:'テスト ひかり'}
 ];
 // Fallback fixtures are never mixed with the existing photos or roster.
 const sourceFiles=['#ffe5c7','#d8f3ef','#e5e0fa','#fbe1ed'].map((color,i)=>
  'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(
   '<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">'+
   '<rect width="160" height="160" rx="20" fill="'+color+'"/>'+
   '<circle cx="80" cy="64" r="30" fill="white"/>'+
   '<text x="80" y="76" text-anchor="middle" font-family="sans-serif" font-size="34" fill="#52695d">'+(i+1)+'</text>'+
   '<text x="80" y="126" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#52695d">SAMPLE</text></svg>'
  ));
 const groups=sourceFiles.map((_,i)=>({key:'demo-group-'+i,indexes:[i]}));
 return {mode:'sample',children,sourceFiles,groups,links:{}};
 }
 let leaving=false;
 function exitToMap(){
  if(leaving)return;
  if(window.parent===window){status.textContent='冒険マップから開いてください。本保存は未接続です。';return;}
  leaving=true;
 // This is an unsaved exit, never a successful-save notification.
  window.parent.postMessage({type:'flower-stage-exit',stage:'memory-catch',saved:false},'*');
 }
 document.getElementById('mapBack').addEventListener('click',exitToMap);
 // Defensive failure if the existing game's save action is invoked directly.
 window.omoideCatchSaveHome=async()=>{
  status.textContent='本保存は未接続です。保存していません。';
  return false;
 };
 function renderGame(payload){
 const {children,sourceFiles,groups}=payload;
 const data={sourceFiles,photoMatchFolderChild:Object.assign(Object.create(null),payload.links),photoFolderUndo:[]};
 const urls=new Map();
 window.addEventListener('pagehide',()=>urls.forEach(url=>URL.revokeObjectURL(url)),{once:true});
 document.getElementById('dataNotice').textContent=payload.mode==='readonly'?
  '既存データを読み取り専用で表示しています（最新の振り分け途中保存）。'+
  (payload.hasSavedGroups?'保存済みの写真グループを使用しています。':'保存済みAIグループがないため、写真を1枚ずつ表示しています。')+
  '新しいAI解析は行いません。操作結果はこの画面内だけで、本保存は未接続です。':
  '既存データを取得できないため、架空の園児とサンプル画像を表示しています。実際の園児・写真ではありません。操作結果はこの画面内だけで、本保存は未接続です。';
 const api={
  valid:()=>!leaving,
  children,
  ensure:()=>groups,
  indexes:(_,folder)=>folder.indexes,
  url:source=>{
   if(typeof source==='string')return source;
   if(!urls.has(source))urls.set(source,URL.createObjectURL(source));
   return urls.get(source);
  },
  assignChild:(current,childId,keys)=>{
   if(!children.some(child=>child.id===childId)||!keys.length||keys.some(key=>!groups.some(group=>group.key===key))){
    throw new Error('表示中のデータを確認できませんでした');
   }
   current.photoFolderUndo.push({...current.photoMatchFolderChild});
   keys.forEach(key=>{current.photoMatchFolderChild[key]=childId});
   return {photos:keys.reduce((n,key)=>n+groups.find(group=>group.key===key).indexes.length,0)};
  },
  undoChild:current=>{
   const previous=current.photoFolderUndo.pop();
   if(!previous)return false;
   current.photoMatchFolderChild=Object.assign(Object.create(null),previous);
   return true;
  },
  next:()=>{status.textContent='次のステージは未接続です。本保存はしていません。';},
  progress:()=>{
   // Preserve the original game and completion design, but expose no fake save.
   const names=host.querySelector('.catchNamesButton');
   if(names){names.disabled=true;names.title='園児の表示名は読み取り専用です';}
   const save=host.querySelector('.catchFinishSave');
   if(save){save.disabled=true;save.textContent='本保存は未接続です';}
   host.querySelectorAll('.catchFinishNext,.catchNext').forEach(button=>{
    button.disabled=true;button.textContent='次のステージは未接続です';
   });
   const finish=host.querySelector('.catchFinishCard');
   if(finish){
    finish.querySelector('.catchFinishStatus').textContent='操作確認が終わりました。本保存はしていません。';
    const back=document.createElement('button');
    back.type='button';back.className='map-back';
    back.textContent='マップへ（保存せず戻る）';
    back.addEventListener('click',exitToMap);finish.append(back);
   }
  }
 };
 if(typeof window.omoideMergeGameRender!=='function'){
  status.textContent='既存ゲームを読み込めませんでした。マップへ戻ってやり直してください。';
  return;
 }
 window.omoideMergeRender(data,host,api);
 }
 const requestId=String(Date.now())+'-'+Math.random().toString(36).slice(2);
 let started=false;
 const timer=setTimeout(()=>start(null),6000);
 function start(payload){
  if(started||leaving)return;
  started=true;clearTimeout(timer);
  renderGame(payload||sampleData());
 }
 window.addEventListener('message',event=>{
  if(event.source===window.parent&&event.data?.type==='flower-catch-data'&&event.data.requestId===requestId){
   start(event.data.payload);
  }
 });
 if(window.parent===window)start(null);
 else window.parent.postMessage({type:'flower-catch-data-request',requestId},'*');
})();
</script>
</body>
</html>
