<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FLOWER JOURNEY 見開き編集・折りたたみツール Ver.5</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;color:#5e554c;background:#dff3e9}*{box-sizing:border-box}body{margin:0}.demo-note{background:#fff8df;padding:9px 14px;display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:12px}.demo-note span{font-size:10px}.app{max-width:1100px;margin:auto;padding:10px 12px 55px;background:linear-gradient(#def4e8,#e1f0ff 45%,#f7fbf5);min-height:100vh}.hero{position:relative}.hero>img{display:block;width:100%;height:auto;aspect-ratio:3/1;object-fit:contain}.back{position:absolute;top:7px;left:7px;border:1px solid #dcb78c;border-radius:30px;background:#fffaf0eb;padding:8px 12px;color:#6b503f;font-weight:700;cursor:pointer}.hero-actions{display:flex;gap:7px;justify-content:center;align-items:center;position:relative;margin-top:clamp(-24px,-4vw,-10px);padding-bottom:12px}.hero-actions button{border:2px solid #fff;border-radius:14px;padding:9px 12px;font-weight:800;color:#74543e;background:#ffe6a7;cursor:pointer}.hero-actions button:first-child{background:#eea0ad;color:white}.hero-actions button:last-child{background:#dbf0df;color:#4d725f}.paper-area{background:#fff;border:2px solid #d6eaf2;border-radius:24px;padding:12px;margin-top:4px}.paper-top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:10px}.paper-top button{border:1px solid #d3e3ed;background:#fbfdff;border-radius:12px;padding:10px;color:#476780;font-size:15px}.paper-top .zoom{margin-left:auto;font-weight:800;color:#476780}.paper{aspect-ratio:1.47;background:repeating-linear-gradient(45deg,#fff 0px,#fff 13px,#faf9f8 13px,#faf9f8 16px);border:1px solid #d7dce0;box-shadow:0 0 0 9px #eaf3f8;margin:12px 9px 18px;position:relative}.paper:after{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:1px dashed #bbcadd}.hint{color:#47718c;background:#f3faff;padding:12px;border-radius:12px;font-size:12px}.tools{margin-top:14px;background:#ffffffef;border-radius:23px;padding:10px 10px 13px;box-shadow:0 4px 16px #657f8c12}.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}.tab{border:0;background:transparent;color:#52667f;padding:7px 1px 4px;display:grid;justify-items:center;gap:5px;font-size:11px;font-weight:800;cursor:pointer;border-radius:16px}.tab .icon{display:grid;place-items:center;width:48px;height:48px;border-radius:50%;background:#b0ebeb;font-size:23px;box-shadow:0 4px #ffffff,0 7px #d5e4e7;transition:transform .18s}.tab:nth-child(2) .icon{background:#ffe6a7}.tab:nth-child(3) .icon{background:#b4dafb}.tab:nth-child(4) .icon{background:#ffd5e1}.tab:nth-child(5) .icon{background:#d9c5f9}.tab[aria-expanded=true]{background:#fff6e9;color:#85543e}.tab[aria-expanded=true] .icon{transform:translateY(-3px);outline:3px solid #f2ad82}.panel{margin-top:12px;border-top:1px solid #e7e8e1;padding:14px 5px 4px;animation:slide .2s ease}.panel[hidden]{display:none}.panel-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px}.panel h2{font-size:15px;margin:0}.close{border:0;border-radius:18px;background:#f5ece5;padding:7px 12px;color:#795c50;font-weight:700;cursor:pointer}.options{display:flex;gap:8px;flex-wrap:wrap}.options button{background:#f8fcfa;border:1px solid #d7e9e7;padding:10px 12px;border-radius:13px;color:#536c6f;font-weight:700;cursor:pointer}.options button:focus-visible,.tab:focus-visible{outline:3px solid #e9a5a0}.desc{font-size:12px;line-height:1.6;color:#75756d;margin:10px 0 0}.tools-footer{font-size:12px;text-align:center;color:#7a8989;margin-top:9px}@keyframes slide{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:translateY(0)}}@media(min-width:800px){.app{padding:18px 28px 60px}.hero-actions{margin-top:-36px}.paper-area{padding:20px}.paper{max-width:830px;margin:20px auto 24px}.tools{max-width:850px;margin:20px auto 0}.tab .icon{width:57px;height:57px;font-size:27px}}@media(max-width:360px){.tab .icon{width:42px;height:42px;font-size:20px}.tab{font-size:10px}.hero-actions{gap:3px}.hero-actions button{padding:7px 5px;font-size:10px}.back{font-size:10px;padding:6px}}
</style></head><body><div class="demo-note"><div><strong>🌺 編集メニュー Ver.5・操作デモ</strong><div><span>見た目と開閉を確認する試作品。実際の編集・保存は行いません。</span></div></div><span>タップして試せるよ</span></div><main class="app"><section class="hero"><img src="assets/canna-wide-header.png" alt="FLOWER JOURNEY 見開き編集！ カンナさんと風車"><button class="back" type="button" onclick="inform()">←マップへ</button><div class="hero-actions"><button type="button" onclick="inform()">💾 保存</button><button type="button" onclick="inform()">✨ この見開きを完成！</button><button type="button" onclick="inform()">🛟 復元</button></div></section><section class="paper-area"><div class="paper-top"><button type="button" onclick="inform()">←</button><button type="button" onclick="inform()">→</button><span class="zoom">100%</span><button type="button" onclick="inform()">−</button><button type="button" onclick="inform()">＋</button></div><div class="paper" aria-label="見開き編集用の紙面イメージ"></div><div class="hint">📖 見開きの紙面は常に見えるまま。下の丸アイコンで必要な道具だけ開けるよ。</div></section><section class="tools" aria-label="編集ツール"><div class="tabs" role="group" aria-label="使う道具を選ぶ"><button class="tab" type="button" data-panel="photo" aria-controls="panel" aria-expanded="false"><span class="icon">🖼️</span>写真</button><button class="tab" type="button" data-panel="background" aria-controls="panel" aria-expanded="false"><span class="icon">🎨</span>背景</button><button class="tab" type="button" data-panel="layout" aria-controls="panel" aria-expanded="false"><span class="icon">▦</span>レイアウト</button><button class="tab" type="button" data-panel="text" aria-controls="panel" aria-expanded="false"><span class="icon">Ｔ</span>文字</button><button class="tab" type="button" data-panel="stamp" aria-controls="panel" aria-expanded="false"><span class="icon">🌸</span>スタンプ</button></div><div id="panel" class="panel" hidden><div class="panel-header"><h2 id="panel-title"></h2><button class="close" type="button" id="close">✕ 閉じる</button></div><div class="options" id="panel-options"></div><p class="desc" id="panel-desc"></p></div></section><div class="tools-footer" id="status" aria-live="polite">道具を選ぶと編集パネルが開くよ 🌷</div></main><script>
const data={photo:['写真をえらぼう','＋ 写真を追加','使う写真','写真を入れ替え','写真を選んで紙面に配置するイメージです。'],background:['背景をえらぼう','無地','柄','好きな色','背景の選択メニューだけを開きます。'],layout:['レイアウト','自由に配置','整列','余白の調整','見開きの配置を調整するメニューです。'],text:['文字を入れよう','＋ テキスト','文字の色','文字の大きさ','タイトルやコメントの編集メニューです。'],stamp:['スタンプ','🌸 お花','⭐ きらきら','❤️ ハート','スタンプの一覧を表示するイメージです。']};let current=null;const tabs=[...document.querySelectorAll('.tab')],panel=document.getElementById('panel');function toggle(key){current=current===key?null:key;tabs.forEach(b=>b.setAttribute('aria-expanded',String(b.dataset.panel===current)));panel.hidden=!current;if(!current){document.getElementById('status').textContent='道具を閉じたよ。紙面を広く確認できるね 🌷';return}const [title,...items]=data[current];document.getElementById('panel-title').textContent=title;document.getElementById('panel-desc').textContent=items.at(-1);document.getElementById('panel-options').replaceChildren(...items.slice(0,-1).map(t=>{const b=document.createElement('button');b.textContent=t;b.type='button';b.onclick=inform;return b}));document.getElementById('status').textContent='「'+title+'」を開いているよ';}tabs.forEach(b=>b.addEventListener('click',()=>toggle(b.dataset.panel)));document.getElementById('close').onclick=()=>toggle(current);function inform(){document.getElementById('status').textContent='これは表示・開閉のデモです。実際の編集機能は正式組み込み時に接続するよ。'}
</script></body></html>
