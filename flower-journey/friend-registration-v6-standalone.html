</style></head><body><main class="stage"><header class="top"><button class="chip" type="button" id="back">← マップへ（デモ）</button><span class="status" id="status">🌙 おともだち 0人</span></header><section class="area" aria-label="園児名簿"><div class="area-head"><h2>✿ おともだち</h2><small>アイコンをタップして編集</small></div><div class="garden"><div id="empty" class="empty"><div class="moon">🌙</div><strong>まだおともだちがいないよ</strong><span>＋から登録してね</span><button type="button" id="firstAdd">＋ おともだちを登録</button></div><div class="grid" id="grid" hidden></div></div></section><div class="bottom-note">✧ デザイン確認用・保存はされません ✧</div></main><div class="overlay" id="overlay" aria-hidden="true"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><button type="button" class="close" id="close" aria-label="閉じる">×</button><h2 id="dialogTitle">🌸 おともだち登録</h2><form id="form"><label class="pick" for="photo"><span class="avatar" id="photoView">＋</span><small>写真を選ぶ・変更する</small></label><input type="file" id="photo" accept="image/*" hidden><label class="field">園児名 <input type="text" id="realName" placeholder="例：ひが かりん" maxlength="80" autocomplete="off" required></label><label class="field">ゲーム内表示名 <input type="text" id="gameName" placeholder="例：かりんちゃん" maxlength="48" autocomplete="off"></label><p class="help">未入力なら、園児名がゲームに表示されるよ</p><p class="error" id="error" role="alert"></p><div class="actions"><button type="button" class="cancel" id="cancel">もどる</button><button type="submit" class="save">登録する ✿</button></div><button class="danger" type="button" id="delete">このおともだちを削除</button></form></div></div><div class="toast" id="toast" role="status"></div><script>
(()=>{'use strict';const $=id=>document.getElementById(id);let children=[],edit=-1,imageData='',toastTimer;function notify(message){$('toast').textContent=message;$('toast').style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').style.display='none',2200)}function photoNode(url){const a=document.createElement('span');a.className='avatar';if(url){const img=document.createElement('img');img.src=url;img.alt='';a.append(img)}else{a.textContent='✿'}return a}function render(){const grid=$('grid');grid.replaceChildren();$('status').textContent=`🌙 おともだち ${children.length}人`;$('empty').hidden=children.length>0;grid.hidden=children.length===0;if(children.length){children.forEach((c,i)=>{const b=document.createElement('button');b.type='button';b.className='friend';b.append(photoNode(c.photo));const label=document.createElement('span');label.className='friend-name';label.textContent=c.game||c.name;b.append(label);b.addEventListener('click',()=>open(i));grid.append(b)});const add=document.createElement('button');add.className='friend add';add.type='button';const plus=document.createElement('span');plus.className='avatar';plus.textContent='+';const label=document.createElement('span');label.className='friend-name';label.textContent='追加';add.append(plus,label);add.addEventListener('click',()=>open(-1));grid.append(add)}}function open(index){edit=index;const c=index<0?{name:'',game:'',photo:''}:children[index];imageData=c.photo;$('realName').value=c.name;$('gameName').value=c.game;$('photo').value='';$('error').textContent='';$('dialogTitle').textContent=index<0?'🌸 おともだち登録':'🌸 おともだち編集';$('delete').style.display=index<0?'none':'block';$('form').querySelector('.save').textContent=index<0?'登録する ✿':'変更を反映 ✿';setPhoto();$('overlay').classList.add('show');$('overlay').setAttribute('aria-hidden','false')};function close(){$('overlay').classList.remove('show');$('overlay').setAttribute('aria-hidden','true')};function setPhoto(){const view=$('photoView');view.replaceChildren();if(imageData){const img=document.createElement('img');img.src=imageData;img.alt='選択中の写真';view.append(img)}else view.textContent='＋'}function resizePhoto(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=()=>reject(Error('読み込み失敗'));reader.onload=()=>{const img=new Image;img.onerror=()=>reject(Error('画像を開けません'));img.onload=()=>{const cv=document.createElement('canvas');cv.width=cv.height=300;const ctx=cv.getContext('2d');const side=Math.min(img.width,img.height),x=(img.width-side)/2,y=(img.height-side)/2;ctx.drawImage(img,x,y,side,side,0,0,300,300);resolve(cv.toDataURL('image/jpeg',.83))};img.src=reader.result};reader.readAsDataURL(file)})}$('photo').addEventListener('change',async e=>{const f=e.target.files&&e.target.files[0];if(!f)return;try{imageData=await resizePhoto(f);setPhoto()}catch{$('error').textContent='写真を読み込めなかったよ'}});$('form').addEventListener('submit',e=>{e.preventDefault();const name=$('realName').value.trim(),game=$('gameName').value.trim();if(!name){$('error').textContent='園児名を入力してね';return}const data={name,game,photo:imageData};if(edit<0)children.push(data);else children[edit]=data;render();close();notify(edit<0?'おともだちが増えたよ！ ✿':'変更したよ！ ✿')});$('delete').addEventListener('click',()=>{if(edit<0)return;if(confirm('このおともだちを一覧から削除しますか？')){children.splice(edit,1);render();close();notify('一覧から削除したよ')}});['cancel','close'].forEach(id=>$(id).addEventListener('click',close));$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))close()});$('firstAdd').addEventListener('click',()=>open(-1));$('back').addEventListener('click',()=>notify('単独プロトタイプなのでマップへは未接続だよ'));render()})();
</script></body></html>
