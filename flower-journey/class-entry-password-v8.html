<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>おもいでブック｜クラス選択・パスワード Ver.8（仮ログイン）</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,"Hiragino Maru Gothic ProN","Yu Gothic",sans-serif}body{background:#d9f4e7;display:grid;place-items:center}.scene{position:relative;width:min(100vw,calc(100dvh * 941 / 1672),650px);aspect-ratio:941/1672;overflow:hidden;background:#d8f5ed;box-shadow:0 5px 30px #325a4b25}.art{width:100%;height:100%;display:block}.character{position:absolute;border:0;background:transparent;border-radius:24%;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:transform .16s,filter .16s;outline-offset:-3px}.character:hover,.character:focus-visible{transform:translateY(-3%) scale(1.055);filter:drop-shadow(0 6px 9px #825d425b)}.character:active{transform:scale(.97)}.character:focus-visible{outline:3px dashed #cc6e74}.character::after{content:'';position:absolute;inset:7%;border:2px solid transparent;border-radius:25%;pointer-events:none}.character:focus-visible::after{border-color:#f3a5aa}.t1{left:4%;top:33%;width:29%;height:23%}.t2{left:35%;top:33%;width:28%;height:23%}.t3{left:67%;top:33%;width:30%;height:23%}.t4{left:4%;top:56%;width:30%;height:22%}.t5{left:35%;top:56%;width:30%;height:22%}.t6{left:67%;top:56%;width:29%;height:22%}
.overlay{position:fixed;inset:0;background:#23463891;display:grid;place-items:center;padding:18px;z-index:10}.overlay[hidden]{display:none}.dialog{width:min(92vw,390px);border-radius:26px;padding:26px 22px 22px;background:#fff9ee;box-shadow:0 18px 60px #264c434e;border:2px solid #fff;text-align:center;color:#624d43}.dialog .flower{font-size:29px}.dialog h2{font-size:23px;margin:10px 0}.dialog p{font-size:14px;line-height:1.7}.dialog label{display:block;text-align:left;font-weight:700;font-size:13px;margin:19px 0 7px}.dialog input{width:100%;font-size:19px;border:2px solid #dfd8c9;border-radius:13px;padding:12px;background:white;outline-color:#de9da4}.buttons{display:flex;gap:9px;margin-top:18px}.buttons button{flex:1;border:0;border-radius:16px;padding:13px 7px;font-weight:800;font-size:14px;cursor:pointer}.cancel{background:#e9ede5;color:#496152}.go{background:#e9a0ac;color:white}.message{min-height:1.4em;color:#bc5961;font-size:12px;margin-top:9px}.demoNotice{position:fixed;bottom:8px;right:8px;font-size:11px;background:#fff9e8dc;border-radius:9px;padding:5px 7px;z-index:2;pointer-events:none}.mock{position:fixed;inset:0;display:none;z-index:12;background:linear-gradient(#d9f5ee,#d5eac4);place-items:center;text-align:center;padding:24px;color:#4f624e}.mock.active{display:grid}.mock h2{font-size:30px}.mock button{border:0;background:#ef9fac;border-radius:20px;color:white;font-weight:800;padding:14px 30px}

.dialog{width:min(92vw,410px);max-height:min(90dvh,760px);overflow-y:auto;padding:14px 19px 20px;animation:pop .28s cubic-bezier(.2,1.2,.35,1) both}
@keyframes pop{from{transform:translateY(18px) scale(.94);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}
.dialog .passwordArt{display:block;width:min(100%,235px);height:clamp(125px,23dvh,204px);object-fit:contain;margin:0 auto -8px;filter:drop-shadow(0 8px 12px #566a5042)}
.dialog h2{font-size:clamp(20px,5vw,25px);margin:4px 0}
.dialog p{margin:6px 0;font-size:13px}
.dialog label{margin:11px 0 6px}
.inputRow{display:flex;gap:7px}
.inputRow input{flex:1;min-width:0}
.showPass{border:2px solid #d9e1d4;border-radius:14px;background:#eef4e9;min-width:46px;font-size:19px}
.overlay{backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
@media(max-height:690px){.dialog .passwordArt{height:115px}.dialog{padding:10px 16px 14px}.dialog label{margin:6px 0 3px}.buttons{margin-top:9px}}
@media(prefers-reduced-motion:reduce){.dialog{animation:none}}
</style></head><body><main class="scene" aria-label="クラスを選んでね"><img class="art" src="assets/class-entry-art.png" alt="おもいでブック　クラスを選んでね。6人の花のキャラクターが並んでいます"><button class="character t1" data-class="たんぽぽ" aria-label="たんぽぽぐみを選択"></button><button class="character t2" data-class="ちゅうりっぷ" aria-label="ちゅうりっぷぐみを選択"></button><button class="character t3" data-class="コスモス" aria-label="コスモスぐみを選択"></button><button class="character t4" data-class="カンナ" aria-label="カンナぐみを選択"></button><button class="character t5" data-class="でいご" aria-label="でいごぐみを選択"></button><button class="character t6" data-class="さくら" aria-label="さくらぐみを選択"></button></main><small class="demoNotice">Ver.8 検証用｜仮パスワード1234・本物の認証ではありません</small><div class="overlay" id="overlay" hidden><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><img class="passwordArt" id="passwordArt" src="password-assets/01.png" alt="パスワード入力中のたんぽぽ"><h2 id="modalTitle">たんぽぽぐみ</h2><p>クラスの パスワードを いれてね 🔐</p><form id="form"><label for="password">パスワード</label><div class="inputRow"><input id="password" type="password" autocomplete="off" placeholder="パスワード" required><button class="showPass" id="showPass" type="button" aria-label="パスワードを表示">👁</button></div><div class="buttons"><button type="button" class="cancel" id="cancel">← もどる</button><button type="submit" class="go">マップへ 🌸</button></div><div class="message" id="message" aria-live="polite"></div></form></section></div><div class="mock" id="mock"><div><div style="font-size:65px">🌼 🌷 🌸</div><h2>マップへ！</h2><p>ここは遷移イメージだよ。<br>正式版では既存のパスワード認証後に<br>FLOWER JOURNEYマップが開きます。</p><button id="restart">クラス選択にもどる</button></div></div><section id="mapView" class="mapView" hidden aria-label="冒険マップ"><div class="mapBar"><span>🌷 <b id="mapClass"></b>｜FLOWER JOURNEY <small>仮ログイン・検証用</small></span><button id="mapBack" type="button">← クラス選択</button></div><iframe id="mapFrame" title="FLOWER JOURNEY 冒険マップ" loading="eager"></iframe></section><style>
.mapView[hidden]{display:none!important}.mapView{position:fixed;inset:0;z-index:25;display:flex;flex-direction:column;background:#e4f3e5;animation:mapFade .65s ease both}.mapBar{flex:none;min-height:46px;background:#fff8e9;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px max(10px,env(safe-area-inset-right));font-size:12px;color:#645346}.mapBar small{font-size:9px;display:block}.mapBar button{border:0;background:#eeb3bd;padding:10px 12px;border-radius:18px;color:#fff;font-weight:700;white-space:nowrap}.mapView iframe{flex:1;min-height:0;width:100%;border:0;background:#dceee8}@keyframes mapFade{from{opacity:0;transform:scale(1.04);filter:blur(5px)}to{opacity:1;transform:scale(1);filter:blur(0)}}.go:disabled{opacity:.6}@media(max-width:370px){.mapBar{font-size:10px}.mapBar button{font-size:11px;padding:8px}}
</style><script>
(()=>{'use strict';
let selected='',lastButton=null;
const names=['たんぽぽ','ちゅうりっぷ','コスモス','カンナ','でいご','さくら'];
const overlay=document.querySelector('#overlay'),password=document.querySelector('#password'),msg=document.querySelector('#message'),mock=document.querySelector('#mock'),art=document.querySelector('#passwordArt'),eye=document.querySelector('#showPass');
function close(){overlay.hidden=true;password.value='';password.type='password';eye.textContent='👁';msg.textContent='';lastButton?.focus()}
document.querySelectorAll('.character').forEach((b,i)=>b.addEventListener('click',()=>{
 selected=b.dataset.class;lastButton=b;
 document.querySelector('#modalTitle').textContent=selected+'ぐみ';
 art.src='password-assets/'+String(i+1).padStart(2,'0')+'.png';art.alt='パソコンでパスワードを入力している'+selected;
 password.type='password';eye.textContent='👁';password.value='';msg.textContent='';
 overlay.hidden=false;requestAnimationFrame(()=>password.focus());
}));
document.querySelector('#cancel').addEventListener('click',close);
eye.addEventListener('click',()=>{const reveal=password.type==='password';password.type=reveal?'text':'password';eye.textContent=reveal?'🙈':'👁';eye.setAttribute('aria-label',reveal?'パスワードを隠す':'パスワードを表示')});
overlay.addEventListener('click',e=>{if(e.target===overlay)close()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!overlay.hidden)close()});
document.querySelector('#form').addEventListener('submit',e=>{
 e.preventDefault();
 if(password.value!=='1234') {msg.textContent='パスワードがちがうよ。もう一度いれてね 🌷';password.focus();password.select();return;}
 msg.textContent='ようこそ、'+selected+'ぐみ！ 🌸';
 const action=document.querySelector('#form .go');action.disabled=true;
 setTimeout(()=>{
   action.disabled=false;close();
   document.getElementById('mapView').hidden=false;
   document.getElementById('mapFrame').src='index.html';
   document.getElementById('mapClass').textContent=selected+'ぐみ';
 },480);
});
document.getElementById('mapBack').addEventListener('click',()=>{document.getElementById('mapFrame').src='about:blank';document.getElementById('mapView').hidden=true;selected='';});
document.querySelector('#restart').addEventListener('click',()=>mock.classList.remove('active'));
})();
</script></body></html>
