@media(prefers-reduced-motion:reduce){.folder{animation:none}}

/* Ver.3 interactive connections: adopted illustration untouched */
.links{position:absolute;inset:0;width:100%;height:100%;z-index:4;pointer-events:none;overflow:visible}

.links circle{stroke:#fff9e1;stroke-width:2}
.section{z-index:6}.centerZone{z-index:6;pointer-events:none}.folder{pointer-events:auto;transition:filter .2s}.folder.active .disk{outline:4px solid #f9e178;outline-offset:4px;box-shadow:0 0 0 8px #fff4b566,0 5px 0 #8b7f5c88}
.kid{transition:transform .18s ease;position:relative;z-index:1}.kid.active{transform:scale(1.15);z-index:5}.kid.linked .portrait{box-shadow:0 0 0 3px #71c3a8,0 3px 8px #648c7880}.kid.active .portrait{outline:3px solid #ffca69;outline-offset:2px}
.status{position:absolute;z-index:9;top:23.4%;left:50%;transform:translateX(-50%);border:2px solid #fff8e9;border-radius:30px;background:#fff7ddf2;color:#725347;font-weight:900;white-space:nowrap;padding:6px 13px;font-size:clamp(10px,2.7vw,13px);box-shadow:0 3px 0 #a3856270;pointer-events:none}

.footer{z-index:10}.footer .pill{background:#fff4ddef}
@media(max-height:650px){.focus{top:72%}.status{top:25%}}

/* Ver.4: 20 children: 5 columns x 2 rows above and below; retain original background */
.many .section{left:4%;width:92%;grid-template-columns:repeat(5,minmax(0,1fr))!important;gap:clamp(4px,1vh,9px) 2px}
.many .section.top{top:18.5%}

.many .portrait{width:clamp(35px,10.3vw,48px);border-width:2px}

.many .centerZone{inset:34.5% 10% 44%;gap:2px 7px}
.many .disk{width:clamp(45px,14vw,64px);height:clamp(45px,14vw,64px)}
.many .folder span{font-size:clamp(9px,2.4vw,11px);padding:2px 5px}
.many .status{top:32.2%}
.many .focus{top:77.5%;left:67%;max-width:64%;padding:4px 9px 4px 5px}
.many .focus .portrait{width:35px}.many .focus strong{font-size:11px}
.links path{paint-order:stroke;stroke-linejoin:round;filter:drop-shadow(0px 0px 2px white)}
@media(max-height:680px){.many .section.top{top:18%}.many .section.bottom{top:60%}.many .centerZone{inset:35% 10% 44%}.many .portrait{width:clamp(30px,9.3vw,41px)}.many .section{gap:2px}.many .focus{top:79%}}
.folder{animation:none!important;translate:none!important} .folder:active{transform:scale(.97)}

/* Confirmed folders are independently recorded: multiple distinct folders may connect to the same child. */
.kid{position:relative}.linkCount{position:absolute;right:-2px;top:-3px;min-width:19px;padding:2px 3px;border-radius:20px;background:#fff4d0;color:#674d40;border:2px solid #fffaf1;line-height:1;font-size:10px;font-weight:900;box-shadow:0 2px 3px #6f71593f;z-index:2}
/* Ver.6: confirm chosen connections per folder */
.status{display:none!important}
.focus{display:none!important}
.confirmBar{position:absolute;left:50%;bottom:10.1%;transform:translateX(-50%);z-index:11;display:flex;gap:7px;align-items:center;justify-content:center;min-width:70%;pointer-events:none}
.confirmBtn{pointer-events:auto;border:3px solid #fff9ec;border-radius:999px;background:linear-gradient(#ffeeb1,#ffd16c);color:#715038;font-size:clamp(13px,3.9vw,18px);font-weight:900;padding:11px 24px;box-shadow:0 5px 0 #c4905a,0 8px 15px #6c65504f;white-space:nowrap;cursor:pointer}
.confirmBtn:disabled{opacity:.72;filter:grayscale(.4);cursor:default}
.confirmBtn:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 #c4905a}
.folder.confirmed .disk{box-shadow:0 0 0 4px #88c9a4,0 4px 0 #8b7f5c88}
.folder.confirmed:after{content:'✓';position:absolute;top:-5px;right:8px;background:#75c69b;color:#234735;border:2px solid #fff;border-radius:100%;font-size:13px;width:21px;height:21px;display:grid;place-items:center;font-weight:900}
.notice{position:absolute;left:50%;top:26%;transform:translateX(-50%);z-index:14;white-space:nowrap;background:#fff9e6;color:#634f3c;border:2px solid white;border-radius:99px;padding:6px 14px;font-size:12px;font-weight:900;opacity:0;pointer-events:none;transition:opacity .2s}
.notice.show{opacity:1}
.many .confirmBar{bottom:10.4%}
@media(max-height:650px){.confirmBar{bottom:9%}}
/* Keep the 6 folder positions stable; completed folder is replaced in the same slot. */
.folder{animation:none!important}

.folder.active .disk{outline:4px solid #ffe57b;outline-offset:2px;box-shadow:0 0 0 7px #fff7d7aa,0 5px 10px #665b4655;}
.links.celebrating path{filter:drop-shadow(0 0 5px #fff) drop-shadow(0 0 7px #ffe37a);transition:stroke-width .15s;}

/* Central completion panel only after all folders have been assigned. */
#finishLayer{position:absolute;inset:0;z-index:70;background:#365b5980;backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;padding:20px}
#finishLayer.show{display:flex}
#finishCard{width:min(88%,350px);background:#fff4d6;border:4px solid #fffdf3;border-radius:36px;box-shadow:0 16px 40px #354a4a55;text-align:center;padding:28px 18px;color:#57463a;animation:finishPop .45s ease-out}
#finishCard .flowerSymbol{font-size:46px;color:#ef9d7b}#finishCard h2{margin:7px 0 9px;font-size:clamp(21px,6vw,28px)}#finishCard p{font-size:14px;line-height:1.5;margin:0 0 17px}
#finishDone{font:900 20px inherit;font-family:inherit;font-weight:900;font-size:20px;padding:14px 60px;border-radius:50px;border:3px solid #fff;background:#f9ce72;color:#634c36;box-shadow:0 5px 0 #c38d52;cursor:pointer}

@keyframes finishPop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.screen.zoomToMap{animation:zoomToMap .86s ease-in forwards;pointer-events:none}@keyframes zoomToMap{to{transform:scale(1.14);opacity:0;filter:blur(6px)}}
</style></head><body><main class="screen"><div class="bg"></div><div class="veil"></div><div class="topbar"><button class="back" id="back">← マップへ</button><div class="brand">COLOR JOURNEY</div></div><svg class="links" id="links" aria-hidden="true"></svg><div class="section top" id="top"></div><section class="centerZone" id="folders" aria-label="仮フォルダ"></section><div class="section bottom" id="bottom"></div><div class="status" id="status" aria-live="polite">フォルダをえらぼう！</div><div class="focus" id="focus" aria-live="polite"></div><div class="notice" id="notice" aria-live="polite"></div><div class="confirmBar"><button class="confirmBtn" id="confirm" type="button" disabled>フォルダをえらぼう</button></div><div class="footer"><button class="pill switch" id="switchCount" type="button">12人 ⇄ 20人</button><span class="pill" id="countSummary">園児12人 · AIフォルダ6こ</span></div><div id="finishLayer" role="dialog" aria-modal="true" aria-label="キャッチ完了"><div id="finishCard"><div class="flowerSymbol">✿</div><h2>ぜんぶキャッチ！</h2><p>おもいでを つなげたよ！</p><button type="button" id="finishDone">完了</button><div id="finishError" role="alert"></div></div></div><div class="modal" id="modal"><div class="popup"><div class="badge" id="icon">✿</div><h2 id="mt"></h2><p id="desc"></p><button id="close">もどる</button></div></div></main><script>
const kids=['あおい','りく','はな','ゆい','そら','れん','みお','さく','ひなた','えま','かな','いつき','みなと','ここな','なお','あかり','はる','いおり','とうま','すず'];
const colors=['#f2b4ab','#bcd8e8','#ecd0a1','#d3c0e8','#b6d5aa','#f2c5bb'];
const hairs=['#664736','#302f38','#895d41','#4f352e','#694d2b','#3c3437'];
const totals=[24,12,18,9,31,16,14,22,8,19,11,27];
let count=12, activeFolder=null, focusKid=null;
let selectionOrigin=null; // kid-first or folder-first
const selectedFolders=new Set();
const associations=Array.from({length:totals.length},()=>new Set());
let nextFolder=6; const slots=[0,1,2,3,4,5];
const confirmed=Array.from({length:totals.length},()=>new Set());
const confirmedFlags=Array(totals.length).fill(false);
const screen=document.querySelector('.screen'), svg=document.getElementById('links');
const status=document.getElementById('status'),focus=document.getElementById('focus');
function drawKids(){
  const top=document.getElementById('top'),bottom=document.getElementById('bottom');top.replaceChildren();bottom.replaceChildren();
  const perRow=count===20?5:6;const perSection=count/2;screen.classList.toggle('many',count===20);
  [top,bottom].forEach(row=>row.style.gridTemplateColumns=`repeat(${perRow},minmax(0,1fr))`);
  kids.slice(0,count).forEach((name,i)=>{
    const el=document.createElement('button');el.className='kid';el.type='button';el.dataset.kid=i;el.setAttribute('aria-label',name+'を選ぶ');
    el.innerHTML='<span class="portrait" style="--b:'+colors[i%6]+';--hair:'+hairs[i%6]+'"></span><span class="kidName">'+name+'</span>';
    el.addEventListener('click',()=>pickKid(i));(i<perSection?top:bottom).append(el);
  });document.getElementById('countSummary').textContent='園児'+count+'人 · 未確定'+(totals.length-confirmedFlags.filter(Boolean).length)+'こ';refresh();requestAnimationFrame(drawLines);
}
const folderRoot=document.getElementById('folders');
function renderFolders(){
 folderRoot.replaceChildren();
 slots.forEach((i,slot)=>{
  if(i===null)return;
  const n=totals[i],x=document.createElement('button');x.type='button';x.className='folder';x.dataset.folder=i;
  x.style.setProperty('--delay','0s');x.style.setProperty('--shade',colors[i%colors.length]);
  x.innerHTML='<div class="disk"><div class="stack"><div class="paper"></div><div class="paper"></div><div class="photo"></div></div></div>';
  x.addEventListener('click',()=>pickFolder(i));folderRoot.append(x);
 });
 requestAnimationFrame(drawLines);
}
renderFolders();
function pickFolder(i){
 if(replacingFolder)return;
 // If the child was chosen first, connect every newly selected folder to them.
 const kidFirst=selectionOrigin==='kid' && focusKid!==null;
 if(selectedFolders.has(i)){
   selectedFolders.delete(i);
   if(kidFirst)associations[i].delete(focusKid);
 } else {
   selectedFolders.add(i);
   if(kidFirst)associations[i].add(focusKid);
 }
 if(!kidFirst)selectionOrigin='folder';
 activeFolder=selectedFolders.size ? Array.from(selectedFolders).at(-1) : null;
 focus.classList.remove('show');refresh();
}
function pickKid(i){
 if(replacingFolder)return;
 // No folder selected: choose a child first, ready for multiple folder taps.
 if(selectedFolders.size===0){
   focusKid=focusKid===i?null:i;
   selectionOrigin=focusKid===null?null:'kid';
 } else {
   focusKid=i;
   if(selectionOrigin==='kid'){
     // Selecting another child starts a new link set only after explicit folder taps.
     // Already linked connections stay intact unless tapped again in folder-first mode.
     selectionOrigin='folder';
   }
   const allLinked=[...selectedFolders].every(f=>associations[f].has(i));
   for(const f of selectedFolders){if(allLinked)associations[f].delete(i);else associations[f].add(i);}
 }
 focus.classList.remove('show');refresh();
}
function mid(el){const r=el.getBoundingClientRect(),p=screen.getBoundingClientRect();return [(r.left+r.right)/2-p.left,(r.top+r.bottom)/2-p.top]}
function refresh(){
 document.querySelectorAll('[data-folder]').forEach(x=>{const f=Number(x.dataset.folder);x.classList.toggle('active',selectedFolders.has(f));x.classList.toggle('confirmed',confirmedFlags[f]);});
 document.querySelectorAll('[data-kid]').forEach(x=>{const i=Number(x.dataset.kid);x.classList.toggle('active',i===focusKid);x.classList.toggle('linked',associations.some(set=>set.has(i)));x.querySelectorAll('.linkCount').forEach(b=>b.remove());});
 status.textContent='';
 const btn=document.getElementById('confirm');
 if(selectedFolders.size===0){btn.textContent='フォルダをえらぼう';btn.disabled=true;}
 else {const n=[...selectedFolders].length;const connected=[...selectedFolders].every(f=>associations[f].size>0);
 btn.disabled=!connected || replacingFolder;
 btn.textContent=connected?(n>1?n+'こまとめて確定！':'このつながりで確定！'):'園児をつなごう';}

 drawLines();
}
function drawLines(){
 svg.replaceChildren();svg.setAttribute('viewBox',`0 0 ${screen.clientWidth} ${screen.clientHeight}`);
 for(const f of slots){
  if(f===null)continue;
  const start=document.querySelector(`[data-folder="${f}"] .disk`);if(!start)continue;
  let [x1,y1]=mid(start);
  for(const kidIndex of associations[f]){
   const child=document.querySelector(`[data-kid="${kidIndex}"] .portrait`);if(!child)continue;
   const [x2,y2]=mid(child);const bend=(y1+y2)/2;
   const path=document.createElementNS('http://www.w3.org/2000/svg','path');
   path.setAttribute('d',`M ${x1} ${y1} C ${x1} ${bend}, ${x2} ${bend}, ${x2} ${y2}`);
   path.setAttribute('stroke',colors[f]);path.setAttribute('stroke-width',selectedFolders.has(f)?'5':'3.5');path.setAttribute('opacity',selectedFolders.has(f)?'1':'.84');if(confirmedFlags[f]){path.setAttribute('stroke-dasharray','none');path.setAttribute('stroke-width','7');}else path.setAttribute('stroke-dasharray','9 5');svg.append(path);
   const dot=document.createElementNS('http://www.w3.org/2000/svg','circle');dot.setAttribute('cx',x2);dot.setAttribute('cy',y2);dot.setAttribute('r',4);dot.setAttribute('fill',colors[f]);svg.append(dot);
  }
 }
}
document.getElementById('switchCount').onclick=()=>{count=count===12?20:12;activeFolder=null;selectedFolders.clear();focusKid=null;selectionOrigin=null;focus.classList.remove('show');associations.forEach(a=>a.clear());confirmed.forEach(a=>a.clear());confirmedFlags.fill(false);nextFolder=6;slots.splice(0,6,0,1,2,3,4,5);renderFolders();drawKids()};
const notice=document.getElementById('notice');let noticeTimer;
function toast(message){notice.textContent=message;notice.classList.add('show');clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>notice.classList.remove('show'),2200)}
let replacingFolder=false;
document.getElementById('confirm').onclick=()=>{
 if(replacingFolder || !selectedFolders.size)return;
 const batch=[...selectedFolders];
 if(batch.some(f=>associations[f].size===0))return;
 replacingFolder=true;
 for(const f of batch){confirmed[f]=new Set(associations[f]);confirmedFlags[f]=true;}
 refresh();svg.classList.add('celebrating');
 toast(batch.length>1?batch.length+'こまとめてキャッチ！':'キャッチ成功！');
 const btn=document.getElementById('confirm');btn.disabled=true;
 setTimeout(()=>{
   svg.classList.remove('celebrating');
   for(const f of batch){const slot=slots.indexOf(f);if(slot!==-1)slots[slot]=nextFolder<totals.length?nextFolder++:null;}
   selectedFolders.clear();activeFolder=null;focusKid=null;selectionOrigin=null;focus.classList.remove('show');
   renderFolders();replacingFolder=false;refresh();
   document.getElementById('countSummary').textContent='園児'+count+'人 · 未確定'+(totals.length-confirmedFlags.filter(Boolean).length)+'こ';
   if(confirmedFlags.every(Boolean)){
     document.getElementById('finishLayer').classList.add('show');
     btn.textContent='✓ ぜんぶ確定！';btn.disabled=true;
   }
 },850);
};
// Prototype-only local save. Production requires IndexedDB/photo-assignment integration.
const finishDone=document.getElementById('finishDone'),finishError=document.getElementById('finishError');
finishDone.onclick=()=>{
  if(!confirmedFlags.every(Boolean))return;
  finishDone.disabled=true;finishDone.textContent='保存中…';finishError.textContent='';
  try{
    const data={version:1,savedAt:new Date().toISOString(),count,assignments:confirmed.map(set=>[...set]),complete:true,prototype:true};
    localStorage.setItem('flowerJourneyCatchDemoV12',JSON.stringify(data));
    if(JSON.parse(localStorage.getItem('flowerJourneyCatchDemoV12')||'null')?.assignments.length!==totals.length)throw new Error('保存を確認できませんでした');
    finishDone.textContent='保存できたよ！';
    screen.classList.add('zoomToMap');
    setTimeout(()=>{if(window.parent!==window)window.parent.postMessage({type:'flower-stage-complete'},'*');else{screen.classList.remove('zoomToMap');finishError.textContent='単独版です。マップ連携版から開くと戻れます。';finishDone.disabled=false;finishDone.textContent='完了';}},650);
  }catch(e){finishDone.disabled=false;finishDone.textContent='もう一度 保存';finishError.textContent='保存できませんでした。もう一度試してね。';}
};
window.addEventListener('resize',drawLines);document.addEventListener('visibilitychange',()=>{if(!document.hidden)drawLines()});
const modal=document.getElementById('modal');function open(t,d){document.getElementById('mt').textContent=t;document.getElementById('desc').textContent=d;modal.classList.add('show')};
document.getElementById('close').onclick=()=>modal.classList.remove('show');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('show')};
document.getElementById('back').onclick=()=>{if(window.parent!==window)window.parent.postMessage({type:'flower-stage-back'},'*');else open('マップへ','マップ連携版から開くと戻れます。')};
drawKids();requestAnimationFrame(drawLines);
</script></body></html>
