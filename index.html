<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>おもいでブック｜メンテナンス中</title>
<style>
:root{color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;color:#344054;background:#fff}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 1px 1px,#e9edf2 1px,transparent 1.5px) 0 0/18px 18px,#fff}
main{width:min(100%,440px);text-align:center;background:rgba(255,255,255,.96);padding:36px 24px;border:1px solid #eef0f3;border-radius:28px;box-shadow:0 12px 36px rgba(30,42,55,.06)}
.brand{font-size:clamp(26px,7vw,36px);font-weight:900;letter-spacing:.04em;color:#9bbdc4;margin:0 0 24px}
.flower{font-size:38px;margin:0 0 12px}
h1{font-size:22px;line-height:1.5;margin:0 0 12px}
p{font-size:14px;line-height:1.9;color:#697586;margin:0}
.note{margin-top:22px;padding:14px;border-radius:14px;background:#f7f9fb;font-size:12px}
</style>
</head>
<body>
<main>
<p class="brand">おもいでブック</p>
<div class="flower" aria-hidden="true">🌼</div>
<h1>ただいまリニューアル準備中です</h1>
<p>使いやすいアプリに作り直すため、いったん公開をお休みしています。<br>準備ができたら、またお知らせします。</p>
<p class="note">このページへの切り替えでは、アプリの保存データや写真を削除していません。再開まで、ブラウザのデータやアプリの保存領域を消去しないでください。</p>
</main>
</body>
</html>
