<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>架空アルバムの双方向同期テスト</title>
<style>
body{font-family:system-ui,-apple-system,sans-serif;max-width:520px;padding:18px;margin:16px auto;background:#f6f8fb;color:#27374b}
main{border-radius:20px;padding:24px;background:white}
h1{font-size:23px;margin:0 0 10px}p{line-height:1.7}
label{display:block;font-weight:700;margin:14px 0 6px;font-size:14px}
select,button{font:inherit;width:100%;border-radius:12px;padding:13px;box-sizing:border-box}
select{border:1px solid #cdd9e5;background:#fff}
button{background:#3f7fd2;color:white;border:0;font-weight:750;margin-top:12px}
button.secondary{background:#ecf1f8;color:#344c6a}button:disabled{opacity:.5}
.card{border:1px solid #e0e7f0;border-radius:16px;padding:16px;margin:15px 0}
.muted{color:#687688;font-size:13px}.status{font-weight:700;margin:12px 0}
#preview{padding:22px;border-radius:16px;text-align:center}
#preview.peach{background:#ffedf0}#preview.mint{background:#e8f8ed}#preview.sky{background:#e8f3ff}
#preview h2{font-size:22px}#preview p{font-size:16px}
</style></head><body><main><h1>📚 架空アルバム同期テスト</h1>
<p class="muted">MacBookとiPhoneで同じ画面を開いて、架空の文字と背景を双方向に同期する実験です。実際のアルバム・写真は扱いません。</p>
<p id="status" class="status" role="status">接続を確認中…</p>
<div class="card"><div>サーバーの保存版：<strong id="revision">未取得</strong></div>
<div class="muted" id="lastTime"></div></div>
<div id="preview" class="peach"><h2 id="previewTitle">テストアルバム</h2><p id="previewMessage">確認中…</p></div>
<label for="title">タイトル（架空の選択肢）</label><select id="title"></select>
<label for="message">メッセージ（架空の選択肢）</label><select id="message"></select>
<label for="color">背景色</label><select id="color"></select>
<button type="button" id="save">💾 この変更をサーバーに保存</button>
<button type="button" id="reload" class="secondary">🔄 サーバーの最新版を読み込む</button>
<p id="conflict" class="status" role="alert"></p>
<p class="muted">4秒ごとに最新版を確認します。編集中の変更は勝手に上書きしません。ほかの端末が先に保存したときは競合として通知します。</p>
<p class="muted">🔒 HTTPS・ペアリング必須。ここから送信できるのは、あらかじめ決められた架空の文字列と背景の選択肢だけです。</p></main>
<script>
const ids=['title','message','color'];
const labels={title:'タイトル',message:'メッセージ',color:'背景色'};
const colors={peach:'ピンク',mint:'ミント',sky:'水色'};
const els=Object.fromEntries(ids.map(id=>[id,document.getElementById(id)]));
const status=document.getElementById('status'),conflict=document.getElementById('conflict'),saveButton=document.getElementById('save');
let current=null,busy=false,changed=false,latestRevision=null;
function selections(){return Object.fromEntries(ids.map(id=>[id,els[id].value]));}
function paint(){document.getElementById('previewTitle').textContent=els.title.value;document.getElementById('previewMessage').textContent=els.message.value;document.getElementById('preview').className=els.color.value;}
function setChoices(choices){for(const key of ids){els[key].replaceChildren();for(const value of choices[key]){const option=document.createElement('option');option.value=value;option.textContent=key==='color'?colors[value]:value;els[key].appendChild(option)}}}
function applyState(data){
 current=data;latestRevision=data.revision;
 for(const key of ids)els[key].value=data[key];
 document.getElementById('revision').textContent='改訂 '+data.revision;
 document.getElementById('lastTime').textContent=data.updatedAt?'最終更新 '+new Date(data.updatedAt).toLocaleString('ja-JP'):'まだ変更されていません';
 changed=false;conflict.textContent='';paint();
}
async function getState(){
 const r=await fetch('/fictional-album/state',{cache:'no-store'});
 const data=await r.json();
 if(!r.ok)throw Error(data.message||'読み込みに失敗しました');
 return data;
}
async function refresh(force=false){
 if(busy)return;
 try{
  const data=await getState();
  if(!current||force){if(force&&changed&&!confirm('編集中の変更を破棄して最新版を読み込みますか？'))return;applyState(data);status.textContent='✅ サーバーの保存版を読み込みました';return;}
  if(data.revision!==current.revision){
   latestRevision=data.revision;
   if(changed){conflict.textContent='⚠️ 別の端末で改訂 '+data.revision+' が保存されました。こちらの編集中の変更は保持しています。';status.textContent='⚠️ 競合を検出しました';}
   else{applyState(data);status.textContent='✅ 別の端末の更新を自動で反映しました';}
  }
 }catch(e){status.textContent='⚠️ '+e.message+'。接続またはペアリングを確認してね。';}
}
async function init(){
 try{
  const response=await fetch('/fictional-album/choices',{cache:'no-store'});
  const data=await response.json();if(!response.ok)throw Error(data.message||'接続できません');
  setChoices(data.choices);await refresh(true);
 }catch(e){status.textContent='⚠️ '+e.message+'。先にペアリングしてください。';}
}
for(const key of ids)els[key].addEventListener('change',()=>{changed=true;paint();status.textContent='✏️ 編集中（まだサーバーには未保存）';});
saveButton.onclick=async()=>{
 if(!current||busy)return;
 busy=true;saveButton.disabled=true;
 try{
  const r=await fetch('/fictional-album/state',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({baseRevision:current.revision,...selections()})});
  const data=await r.json();
  if(r.status===409){conflict.textContent='⚠️ 競合しました！別の端末が先に保存しています。編集内容は残っています。';status.textContent='⚠️ 保存されませんでした。最新版を確認してね。';return;}
  if(!r.ok)throw Error(data.message||'保存できませんでした');
  applyState(data.state);status.textContent=data.unchanged?'✅ 変更はありません（最新版です）':'✅ サーバーに保存しました。もう一方の端末にも反映されます。';
 }catch(e){status.textContent='⚠️ '+e.message+'。編集内容は画面に残っています。';}
 finally{busy=false;saveButton.disabled=false;}
};
document.getElementById('reload').onclick=()=>refresh(true);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
setInterval(()=>{if(!document.hidden)refresh()},4000);
init();
</script></body></html>
